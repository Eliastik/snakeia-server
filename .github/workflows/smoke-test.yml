name: Smoke test server

on:
  push:
    branches:
      - master

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Dependencies
      run: npm install

    - name: Install socket.io-client for smoke tests
      run: npm install socket.io-client

    - name: Start server in background with healthcheck enabled
      run: npm start &
      env:
        PORT: 3000
        ENABLE_HEALTHCHECK: "true"
      id: start-server

    - name: Wait for server to be ready
      run: sleep 5

    - name: Test HTTP root endpoint
      run: curl -f http://localhost:3000/ || exit 1

    - name: Test HTTP /healthcheck endpoint
      run: |
        echo "=== Testing HTTP /healthcheck ==="
        curl -s http://localhost:3000/healthcheck | jq .
        status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/healthcheck)
        if [ "$status" != "200" ]; then
          echo "HTTP /healthcheck returned $status"
          exit 1
        fi
        echo "HTTP /healthcheck is working"

    - name: Test Socket.io /healthcheck namespace
      run: |
        node -e "
          const { io } = require('socket.io-client');
          const socket = io('http://localhost:3000/healthcheck', { withCredentials: false });
          let receivedPong = false;
          let timeout;

          socket.on('connect', () => {
            console.log('Socket.io /healthcheck connected:', socket.id);
            socket.emit('ping');
          });

          socket.on('pong', (data) => {
            console.log('Received pong event:', JSON.stringify(data));
            if (data && data.status === 'ok') {
              receivedPong = true;
              console.log('Socket.io /healthcheck namespace is working');
            }
          });

          timeout = setTimeout(() => {
            if (!receivedPong) {
              console.error('Timeout: no pong event received');
              process.exit(1);
            } else {
              socket.close();
              process.exit(0);
            }
          }, 8000);

          socket.on('close', () => {
            clearTimeout(timeout);
          });
        "

    - name: Debug server logs on failure
      if: failure()
      run: |
        echo "=== Server process ==="
        ps aux | grep node
        echo "=== Port binding ==="
        netstat -tlnp 2>/dev/null || ss -tlnp

    - name: Stop server
      if: always()
      run: pkill -f "node server.js" || true
