version: "3.4"

services:
  snakeia-server:
    image: eliastik/snakeia-server:latest
    container_name: snakeia-server
    restart: unless-stopped
    # uncomment to build the image
    # build:
      # context: .
      # dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      ENABLE_HEALTHCHECK: true
    volumes:
      - ./config/default.yaml:/home/snakeia-server/server/config/default.yaml
      # - ./config/local.yaml:/home/snakeia-server/server/config/local.yaml
      - ./error.log:/home/snakeia-server/server/logs/error.log
      - ./server.log:/home/snakeia-server/server/logs/server.log
    ports:
      - "3000:3000"